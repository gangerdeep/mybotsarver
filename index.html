<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Premium Nickname Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- ✅ Adsense main script (HEAD me, only once) -->
<script async
  src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3359091935607457"
  crossorigin="anonymous"></script>

<style>
body{
  margin:0;
  min-height:100vh;
  font-family:Arial, sans-serif;
  background: linear-gradient(270deg,#050816,#0b0f2e,#1a0f2e,#050816);
  background-size:400% 400%;
  animation:bgMove 15s ease infinite;
}
@keyframes bgMove{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.box{
  max-width:400px;
  margin:30px auto;
  background:rgba(5,5,20,0.88);
  padding:20px;
  border-radius:20px;
  text-align:center;
  box-shadow:0 20px 40px rgba(0,0,0,0.95);
}

.top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:15px;
  font-weight:bold;
  color:white;
}
.top a{
  display:flex;
  align-items:center;
  gap:6px;
  text-decoration:none;
  color:#ff4fa3;
}
.top img{width:24px;height:24px;}

.header{
  background: linear-gradient(180deg,#000,#070716);
  padding:22px 15px;
  margin:-20px -20px 20px -20px;
  border-radius:20px 20px 14px 14px;
  color:white;
}

.adsbygoogle{
  display:block;
  margin:15px auto;
}

input{
  width:100%;
  padding:13px;
  margin-top:14px;
  border:none;
  border-radius:14px;
  font-size:16px;
  background:#02030c;
  color:white;
}

button{
  width:100%;
  margin-top:16px;
  padding:14px;
  border:none;
  border-radius:14px;
  font-size:17px;
  font-weight:bold;
  color:white;
  cursor:pointer;
  background: linear-gradient(120deg,#0f3d2e,#1f7a4a,#0f3d2e);
}

.nick{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  font-size:18px;
  cursor:pointer;
  display:flex;
  justify-content:center;
  gap:10px;
  color:white;
}
.nick:hover{background:rgba(255,255,255,0.05)}

.arrow{
  background: linear-gradient(90deg,#ffd000,#ff0033);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

.toast{
  position:fixed;
  bottom:30px;
  left:50%;
  transform:translateX(-50%);
  background:#000;
  padding:10px 18px;
  border-radius:20px;
  opacity:0;
  transition:.3s;
  color:white;
}
.toast.show{opacity:1;}
</style>
</head>

<body>

<div class="box">

  <div class="top">
    <span>Developed</span>
    <a href="https://www.instagram.com/sandeep._.op" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg">
      sandeep._.op
    </a>
  </div>

  <div class="header">
    <h2>🩷 Premium Nickname Generator</h2>
    <small>20+ Stylish Symbols & Fonts</small>
  </div>

  <!-- 🔝 TOP AD -->
  <ins class="adsbygoogle"
       data-ad-client="ca-pub-3359091935607457"
       data-ad-slot="9302973359"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <input type="text" id="name" placeholder="Enter your name">
  <button onclick="generate()">Generate Nicknames</button>

  <div id="result"></div>

  <!-- 🔻 BOTTOM AD (same slot allowed for now) -->
  <ins class="adsbygoogle"
       data-ad-client="ca-pub-3359091935607457"
       data-ad-slot="9302973359"
       data-ad-format="auto"
       data-full-width-responsive="true"></ins>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

</div>

<div class="toast" id="toast">Copied ✔</div>

<script>
const heavy=["꧁","𓆩","♛","亗","☠","『","【"];
const light=["✦","彡","★","☯","ツ","•"];
const suffixH=["꧂","𓆪","♛","亗","☠","』","】"];
const suffixL=["✦","彡","★","☯","ツ","•"];
const middle=["","•","ツ","么","メ","✘","⚡","☯"];

const fonts=[
 {a:"𝖆",b:"𝖇",c:"𝖈",d:"𝖉",e:"𝖊",f:"𝖋",g:"𝖌",h:"𝖍",i:"𝖎",j:"𝖏",k:"𝖐",l:"𝖑",m:"𝖒",n:"𝖓",o:"𝖔",p:"𝖕",q:"𝖖",r:"𝖗",s:"𝖘",t:"𝖙",u:"𝖚",v:"𝖛",w:"𝖜",x:"𝖝",y:"𝖞",z:"𝖟",
  A:"𝕬",B:"𝕭",C:"𝕮",D:"𝕯",E:"𝕰",F:"𝕱",G:"𝕲",H:"𝕳",I:"𝕴",J:"𝕵",K:"𝕶",L:"𝕷",M:"𝕸",N:"𝕹",O:"𝕺",P:"𝕻",Q:"𝕼",R:"𝕽",S:"𝕾",T:"𝕿",U:"𝖀",V:"𝖁",W:"𝖂",X:"𝖃",Y:"𝖄",Z:"𝖅"}
];

function stylishName(text,font){
  return text.split("").map(c=>font[c]||c).join("");
}

function generate(){
  let name=document.getElementById("name").value.trim();
  if(!name) return alert("Enter name");

  let font=fonts[Math.floor(Math.random()*fonts.length)];
  let result=document.getElementById("result");
  result.innerHTML="";

  for(let i=0;i<5;i++){
    let nick=heavy[Math.floor(Math.random()*heavy.length)]
      + stylishName(name,font)
      + middle[Math.floor(Math.random()*middle.length)]
      + suffixH[Math.floor(Math.random()*suffixH.length)];

    let d=document.createElement("div");
    d.className="nick";
    d.innerHTML=`<span class="arrow">➜</span>${nick}`;
    d.onclick=()=>copyText(nick);
    result.appendChild(d);
  }
}

function copyText(text){
  navigator.clipboard.writeText(text);
  let t=document.getElementById("toast");
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1200);
}
</script>

</body>
</html>
