<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>

<style>
body{
    margin:0;
    background:black;
    font-family:Arial;
    text-align:center;
    color:white;
    overflow:hidden;
}

/* TEXT */
h1{margin-top:30px;font-size:50px;}
h2{
    color:#ff2da6;
    text-shadow:0 0 10px #ff2da6,0 0 20px #ff2da6;
}

/* CAKE */
.cake{
    width:220px;
    height:120px;
    margin:30px auto;
    background:linear-gradient(#5a2e0f,#2b1406);
    border-radius:20px;
    position:relative;
    z-index:5;
}
.cake:before{
    content:"";
    position:absolute;
    top:-30px;
    left:10px;
    width:200px;
    height:60px;
    background:white;
    border-radius:50%;
}

/* BALLOON */
.balloon{
    position:absolute;
    width:40px;
    height:55px;
    border-radius:50%;
    bottom:-60px;
    z-index:10;
    animation:rise 6s linear forwards;
}
@keyframes rise{
    from{transform:translateY(0);}
    to{transform:translateY(-110vh);}
}

/* FIREWORK */
.spark{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    z-index:1;
    animation:explode 1s forwards;
}
@keyframes explode{
    to{
        transform:translate(var(--x),var(--y));
        opacity:0;
    }
}

/* HEART */
.heart{
    font-size:28px;
    color:#ff0066;
    text-shadow:0 0 10px #ff0066;
    animation:pulse 1s infinite alternate;
}
@keyframes pulse{
    from{transform:scale(1);}
    to{transform:scale(1.2);}
}

/* HEARTBEAT */
.line{
    fill:none;
    stroke:yellow;
    stroke-width:3;
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:hb 2s linear infinite;
}
@keyframes hb{
    to{stroke-dashoffset:0;}
}
</style>
</head>

<body>

<h1>Happy Birthday</h1>
<h2>Muskan Singh</h2>

<div class="cake"></div>

<div class="heart">❤</div>

<svg width="200" height="60">
<path class="line"
d="M0 30 L20 30 L30 10 L40 50 L50 30 L70 30 L80 20 L90 40 L100 30 L200 30"/>
</svg>

<script>

/* BALLOONS */
function createBalloon(){
    let b=document.createElement("div");
    b.className="balloon";
    b.style.left=Math.random()*90+"%";
    b.style.background="hsl("+Math.random()*360+",80%,60%)";
    document.body.appendChild(b);

    setTimeout(()=>{b.remove();},6000);
}
setInterval(createBalloon,800);

/* FIREWORKS */
function createFirework(){
    let x=Math.random()*window.innerWidth;
    let y=Math.random()*window.innerHeight/2;

    for(let i=0;i<25;i++){
        let s=document.createElement("div");
        s.className="spark";
        s.style.left=x+"px";
        s.style.top=y+"px";
        s.style.background="hsl("+Math.random()*360+",100%,60%)";
        s.style.setProperty('--x',(Math.random()*200-100)+"px");
        s.style.setProperty('--y',(Math.random()*200-100)+"px");
        document.body.appendChild(s);
        setTimeout(()=>s.remove(),1000);
    }
}
setInterval(createFirework,2000);

</script>

</body>
</html>
