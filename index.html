<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Telegram Bot Uploader</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
    background:linear-gradient(135deg,#0088cc,#00bfff);
    font-family:Arial;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}
.card{
    background:#fff;
    width:350px;
    padding:20px;
    border-radius:15px;
    text-align:center;
}
input,button{
    width:100%;
    padding:10px;
    margin:10px 0;
}
button{
    background:#0088cc;
    color:#fff;
    border:none;
    border-radius:20px;
    font-size:16px;
}
</style>
</head>

<body>

<div class="card">
    <h2>🤖 Telegram Bot Maker</h2>

    <form action="upload.php" method="post" enctype="multipart/form-data">
        <input type="file" name="botfile" accept=".php" required>
        <input type="text" name="token" placeholder="Enter Bot Token" required>
        <button type="submit">Upload Bot & Go Live</button>
    </form>

    <p style="font-size:12px;color:#555">
        Upload only PHP bot files
    </p>
</div>

</body>
</html>
