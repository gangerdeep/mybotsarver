
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #ff0000; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { background: #ff0000; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #cc0000; }
        #result { margin-top: 20px; }
        .download-btn { background: #28a745; text-decoration: none; color: white; padding: 10px; border-radius: 5px; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h2>YT Downloader</h2>
    <p>Paste your video link below:</p>
    <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
    <button onclick="downloadVideo()">Get Download Link</button>

    <div id="result"></div>
</div>

<script>
    async function downloadVideo() {
        const url = document.getElementById('videoUrl').value;
        const resultDiv = document.getElementById('result');
        
        if(!url) { alert("Please paste a URL!"); return; }

        resultDiv.innerHTML = "⏳ Processing...";

        // Note: Using a public API for demonstration. 
        // Real-world apps often use private RapidAPI keys.
        try {
            const response = await fetch(`https://api.your-chosen-api-provider.com/download?url=${encodeURIComponent(url)}`);
            const data = await response.json();

            if(data.success) {
                resultDiv.innerHTML = `
                    <p><strong>${data.title}</strong></p>
                    <a href="${data.download_url}" class="download-btn" target="_blank">Download MP4</a>
                `;
            } else {
                resultDiv.innerHTML = "❌ Error: Could not fetch video.";
            }
        } catch (error) {
            resultDiv.innerHTML = "❌ API Error. (Check Console)";
            console.error(error);
        }
    }
</script>

</body>
</html>
