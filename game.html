<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Telegram Bot Maker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#0088cc,#00bfff);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    background:#fff;
    width:350px;
    padding:25px;
    border-radius:15px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

.card img{
    width:70px;
    margin-bottom:10px;
}

h2{
    margin:10px 0;
    color:#0088cc;
}

input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:8px;
    border:1px solid #ccc;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    background:#0088cc;
    color:#fff;
    border:none;
    border-radius:25px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#006fa8;
}

.steps{
    text-align:left;
    font-size:13px;
    margin-top:15px;
    color:#333;
}

.result{
    margin-top:15px;
    font-size:14px;
    color:green;
    display:none;
}
</style>
</head>

<body>

<div class="card">
    <img src="https://telegram.org/img/t_logo.png" alt="Telegram">
    <h2>Telegram Bot Maker</h2>

    <input type="text" id="token" placeholder="Enter Bot Token">

    <button onclick="createBot()">Create Bot</button>

    <div class="result" id="result">
        ✅ Bot token saved successfully!  
        <br>Now connect backend (PHP / Node)
    </div>

    <div class="steps">
        <b>How to get Bot Token:</b>
        <ol>
            <li>Open Telegram</li>
            <li>Search <b>@BotFather</b></li>
            <li>Type <code>/start</code></li>
            <li>Use <code>/newbot</code></li>
            <li>Copy token & paste here</li>
        </ol>
    </div>
</div>

<script>
function createBot(){
    const token = document.getElementById("token").value;
    if(token.length < 20){
        alert("Please enter valid bot token");
        return;
    }
    document.getElementById("result").style.display="block";
}
</script>

</body>
</html>
