<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Premium Nickname Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);
  font-family:Arial;
  color:white;
}
.box{
  max-width:400px;
  margin:30px auto;
  background:rgba(0,0,0,0.5);
  padding:20px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* Top bar */
.top{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin-bottom:20px;
  font-weight:bold;
}
.top a{
  display:flex;
  align-items:center;
  text-decoration:none;
  color:white;
  gap:5px;
}
.top img{
  width:25px;
  height:25px;
}

/* Nickname generator */
input,button{
  width:100%;
  padding:12px;
  margin-top:12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
}
button{
  background:#ff0055;
  color:white;
}
.nick{
  margin-top:10px;
  padding:10px;
  background:#000;
  border-radius:10px;
  font-size:16px;
  letter-spacing:1px;
  word-wrap:break-word;
}
</style>
</head>

<body>

<div class="box">
  <!-- Top bar -->
  <div class="top">
    <span>Developed</span>
    <a href="https://www.instagram.com/sandeep._.op?igsh=MTJhZWpybTF6NmRkZw==" target="_blank">
      <img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram">
      sandeep._.op
    </a>
  </div>

  <h2>👑 Premium Nickname Generator</h2>
  <small>Enter your name to get premium stylish nickname (symbols only)</small>

  <input type="text" id="name" placeholder="Enter your name">
  <button onclick="generate()">Generate Nicknames</button>

  <div id="result"></div>
</div>

<script>
const stylish = ["𝕯","𝖆","𝖗","𝖐","ツ","亗","乂","么","꧁","꧂","★","⚡","♛","彡","☯","☠","✦","❖","❂","✪","✧","✰"];
const numbers = Array.from({length:999}, (_,i)=>i+1);
const separators = ["","_","-","~","•","☆"];

function generate(){
  let name = document.getElementById("name").value.trim();
  if(name===""){
    alert("Please enter your name");
    return;
  }

  const result = document.getElementById("result");
  result.innerHTML = "";

  for(let i=0;i<10;i++){ // 10 nicknames
    let pre = stylish[Math.floor(Math.random()*stylish.length)];
    let post = stylish[Math.floor(Math.random()*stylish.length)];
    let sep = separators[Math.floor(Math.random()*separators.length)];
    let num = numbers[Math.floor(Math.random()*numbers.length)];

    // Construct nickname: pre + userName + separator + number + post
    let nick = pre + name + sep + num + post;

    let div = document.createElement("div");
    div.className = "nick";
    div.innerText = nick;
    result.appendChild(div);
  }
}
</script>

</body>
</html>
